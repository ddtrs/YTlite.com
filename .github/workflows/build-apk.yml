name: Build SmartTube APK (with Rust JSON)

on:
  workflow_dispatch:   # запуск вручную кнопкой "Run workflow"
  push:
    branches: [ main, master ]

env:
  SMARTTUBE_SHA: a0c319a88cc7ac65749dd353c404e4aa3fddb9bc
  MEDIASERVICECORE_SHA: bad6cb5791f996e6026f1c4a76313adc94c001c7
  SHAREDMODULES_SHA: e12618a07ada786d5b731b2d668efe1383992547

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout patches
        uses: actions/checkout@v4

      - name: Fetch SmartTube sources at pinned commits
        run: |
          git clone https://github.com/yuliskov/SmartTube.git SmartTube
          git -C SmartTube checkout "$SMARTTUBE_SHA"
          rm -rf SmartTube/MediaServiceCore SmartTube/SharedModules
          git clone https://github.com/yuliskov/MediaServiceCore.git SmartTube/MediaServiceCore
          git -C SmartTube/MediaServiceCore checkout "$MEDIASERVICECORE_SHA"
          git clone https://github.com/yuliskov/SharedModules.git SmartTube/SharedModules
          git -C SmartTube/SharedModules checkout "$SHAREDMODULES_SHA"

      - name: Apply Rust patches
        run: |
          git -C SmartTube apply --verbose "$GITHUB_WORKSPACE/PATCHES/SmartTube.patch"
          git -C SmartTube/MediaServiceCore apply --verbose "$GITHUB_WORKSPACE/PATCHES/MediaServiceCore.patch"

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Rust tests (host)
        working-directory: SmartTube/MediaServiceCore/youtubeapi/rust/stjson
        env:
          ST_CORPUS: ${{ github.workspace }}/SmartTube/MediaServiceCore/youtubeapi/src/test/resources
        run: cargo test --release

      - name: Build libstjson.so for Android (arm, arm64, x86)
        run: |
          NDK_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -n1)
          if [ -z "$NDK_PATH" ]; then
            yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264"
            NDK_PATH="/usr/local/lib/android/sdk/ndk/26.3.11579264"
          fi
          export ANDROID_NDK_HOME="$NDK_PATH"
          echo "Using NDK: $ANDROID_NDK_HOME"
          sed -i 's/\r$//' SmartTube/MediaServiceCore/youtubeapi/rust/build-android.sh
          chmod +x SmartTube/MediaServiceCore/youtubeapi/rust/build-android.sh
          SmartTube/MediaServiceCore/youtubeapi/rust/build-android.sh armeabi-v7a arm64-v8a x86

      - name: Build APK (debug-signed, installs without extra steps)
        working-directory: SmartTube
        run: |
          chmod +x gradlew
          ./gradlew assembleStbetaDebug -PskipRust --stacktrace

      - name: Check that the Rust library is inside the APK
        run: |
          APK=$(ls SmartTube/smarttubetv/build/outputs/apk/stbeta/debug/*.apk | head -n1)
          echo "$APK"
          unzip -l "$APK" | grep libstjson

      - uses: actions/upload-artifact@v4
        with:
          name: SmartTube-rust-apk
          path: SmartTube/smarttubetv/build/outputs/apk/stbeta/debug/*.apk
          if-no-files-found: error
          
